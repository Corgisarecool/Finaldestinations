<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grave & History Atlas</title>

  <!-- Leaflet map -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f1ea;
      color: #292821;
    }

    header {
      background: #24251f;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
      font-family: Georgia, serif;
    }

    header p {
      margin: 0;
      color: #d8d4c8;
    }

    .search-area {
      background: #35372e;
      padding: 15px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    input, select, button {
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #bbb;
      font-size: 15px;
    }

    input {
      width: min(500px, 90vw);
    }

    button {
      background: #8b6f47;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #705735;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: calc(100vh - 137px);
      min-height: 550px;
    }

    .filters {
      background: #e5e0d5;
      padding: 20px;
      border-right: 1px solid #c7c1b4;
      overflow-y: auto;
    }

    .filters h2 {
      font-family: Georgia, serif;
      margin-top: 0;
    }

    .filters label {
      display: block;
      margin: 15px 0 6px;
      font-weight: bold;
    }

    .filters select {
      width: 100%;
      background: white;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .legend {
      margin-top: 25px;
      padding: 15px;
      background: #f7f5ef;
      border-radius: 8px;
    }

    .legend div {
      margin: 8px 0;
    }

    .grave-dot {
      color: #7b3030;
      font-size: 20px;
    }

    .history-dot {
      color: #315d3a;
      font-size: 20px;
    }

    @media (max-width: 700px) {
      .layout {
        grid-template-columns: 1fr;
        height: auto;
      }

      .filters {
        border-right: none;
        border-bottom: 1px solid #c7c1b4;
      }

      #map {
        height: 600px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Grave & History Atlas</h1>
  <p>Discover the people, places, and stories hidden around us.</p>
</header>

<div class="search-area">
  <input
    id="search"
    type="text"
    placeholder="Search people, places, cemeteries..."
  >

  <button onclick="searchAtlas()">Search</button>
</div>

<div class="layout">

  <aside class="filters">

    <h2>Refine Search</h2>

    <label>Atlas</label>
    <select id="atlas" onchange="filterPlaces()">
      <option value="all">Everything</option>
      <option value="grave">Graves & Cemeteries</option>
      <option value="history">Historical Places</option>
    </select>

    <label>Type</label>
    <select id="type" onchange="filterPlaces()">
      <option value="all">All types</option>
      <option value="cemetery">Cemetery</option>
      <option value="grave">Grave</option>
      <option value="building">Historic Building</option>
      <option value="battle">Battle Site</option>
      <option value="ruin">Ruin</option>
      <option value="monument">Monument</option>
    </select>

    <label>Time Period</label>
    <select id="period" onchange="filterPlaces()">
      <option value="all">Any period</option>
      <option value="1600">1600–1700</option>
      <option value="1700">1700–1800</option>
      <option value="1800">1800–1900</option>
      <option value="1900">1900–2000</option>
      <option value="2000">2000–Present</option>
    </select>

    <br>

    <button onclick="resetFilters()">Reset Filters</button>

    <div class="legend">
      <strong>Map Key</strong>

      <div>
        <span class="grave-dot">●</span>
        Graves & Cemeteries
      </div>

      <div>
        <span class="history-dot">●</span>
        Historical Places
      </div>
    </div>

  </aside>

  <main id="map"></main>

</div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  /*
   * SAMPLE DATA
   *
   * These are only examples.
   * Later we will replace this with your real database.
   */

  const places = [

    {
      name: "Old Cemetery",
      description: "Example historic cemetery.",
      category: "grave",
      type: "cemetery",
      period: "1800",
      lat: 41.76,
      lng: -72.69
    },

    {
      name: "Historic Mill",
      description: "Example historic industrial site.",
      category: "history",
      type: "building",
      period: "1800",
      lat: 41.82,
      lng: -72.64
    },

    {
      name: "Revolutionary War Site",
      description: "Example historical site.",
      category: "history",
      type: "battle",
      period: "1700",
      lat: 41.78,
      lng: -72.72
    },

    {
      name: "Unknown Grave",
      description: "Example unidentified historic grave.",
      category: "grave",
      type: "grave",
      period: "1900",
      lat: 41.73,
      lng: -72.67
    }

  ];

  /*
   * CREATE MAP
   */

  const map = L.map("map").setView([41.76, -72.69], 10);

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);

  let markers = [];

  /*
   * DISPLAY PLACES
   */

  function displayPlaces(list) {

    markers.forEach(marker => map.removeLayer(marker));

    markers = [];

    list.forEach(place => {

      const color =
        place.category === "grave"
          ? "#7b3030"
          : "#315d3a";

      const marker = L.circleMarker(
        [place.lat, place.lng],
        {
          radius: 9,
          fillColor: color,
          color: "#ffffff",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        }
      );

      marker.bindPopup(`
        <h3>${place.name}</h3>
        <p>${place.description}</p>
        <p>
          <strong>Type:</strong> ${place.type}<br>
          <strong>Period:</strong> ${place.period}
        </p>
      `);

      marker.addTo(map);

      markers.push(marker);
    });
  }

  /*
   * FILTERS
   */

  function filterPlaces() {

    const atlas = document.getElementById("atlas").value;
    const type = document.getElementById("type").value;
    const period = document.getElementById("period").value;

    const filtered = places.filter(place => {

      const atlasMatch =
        atlas === "all" ||
        place.category === atlas;

      const typeMatch =
        type === "all" ||
        place.type === type;

      const periodMatch =
        period === "all" ||
        place.period === period;

      return atlasMatch && typeMatch && periodMatch;

    });

    displayPlaces(filtered);
  }

  /*
   * SEARCH
   */

  function searchAtlas() {

    const query =
      document.getElementById("search").value
      .toLowerCase()
      .trim();

    if (!query) {
      displayPlaces(places);
      return;
    }

    const results = places.filter(place =>
      place.name.toLowerCase().includes(query) ||
      place.description.toLowerCase().includes(query) ||
      place.type.toLowerCase().includes(query)
    );

    displayPlaces(results);

    if (results.length > 0) {
      map.setView(
        [results[0].lat, results[0].lng],
        12
      );
    } else {
      alert("No locations found.");
    }
  }

  /*
   * RESET
   */

  function resetFilters() {

    document.getElementById("atlas").value = "all";
    document.getElementById("type").value = "all";
    document.getElementById("period").value = "all";
    document.getElementById("search").value = "";

    displayPlaces(places);
  }

  /*
   * SHOW INITIAL PLACES
   */

  displayPlaces(places);

</script>

</body>
</html>
